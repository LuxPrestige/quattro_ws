game_controller_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0
    sticky_buttons: false

quattro_teleop:
  ros__parameters:
    # Reference Switch Pro mapping.
    axis_linear_x: 1
    axis_linear_y: 0
    axis_height: 3
    axis_yaw: 2
    button_switch_mode: 0
    button_estop: 1
    button_imu_auto: 3

    # Standard ROS interface values use SI units.
    scale_linear_x: 0.30
    scale_linear_y: 0.30
    scale_yaw: 1.0
    # Absolute body heights in view mode. body_height_default must match
    # quattro/config/kinematics.yaml nominal_height.
    body_height_min: 0.17
    body_height_default: 0.28
    body_height_max: 0.40
    scale_roll_pitch: 0.585
    deadzone: 0.10
    joy_timeout_sec: 0.5
    publish_rate_hz: 20.0
    start_stepping: true
