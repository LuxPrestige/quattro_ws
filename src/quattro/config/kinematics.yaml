pose_controller:
  ros__parameters:
    hip_offset_y: 0.0905           # 힙 요(yaw) 관절과 어퍼레그 관절 사이 오프셋 링크 길이 (m)
    upper_leg_length: 0.210        # 허벅지(upper leg) 링크 길이 (m)
    lower_leg_length: 0.210        # 정강이(lower leg) 링크 길이 (m)
    hip_spacing_x: 0.405           # 4개 힙 관절의 전후(x) 간격 (m)
    hip_spacing_y: 0.120           # 4개 힙 관절의 좌우(y) 간격 (m)
    foot_spacing_x: 0.405          # 기본 자세에서 발의 전후(x) 간격 (m)
    foot_spacing_y: 0.301          # 기본 자세에서 발의 좌우(y) 간격 (m)
    nominal_height: 0.280          # 몸통 기준점에서 발까지의 기본 높이 (m)
    center_of_mass_offset_x: 0.000 # IK 목표 좌표의 x축 보정값 (무게중심이 기하학적 중심에서 벗어난 만큼 보정, m)
    trajectory_duration: 0.25      # 발행되는 관절 궤적 포인트(JointTrajectoryPoint)의 도달 시간 (s)

gait_controller:
  ros__parameters:
    # --- 로봇 형상 파라미터 (pose_controller와 동일한 값) ---
    hip_offset_y: 0.0905           # 힙 요(yaw) 관절과 어퍼레그 관절 사이 오프셋 링크 길이 (m)
    upper_leg_length: 0.210        # 허벅지(upper leg) 링크 길이 (m)
    lower_leg_length: 0.210        # 정강이(lower leg) 링크 길이 (m)
    hip_spacing_x: 0.405           # 4개 힙 관절의 전후(x) 간격 (m)
    hip_spacing_y: 0.120           # 4개 힙 관절의 좌우(y) 간격 (m)
    foot_spacing_x: 0.455          # 기본 자세에서 발의 전후(x) 간격 (m)
    foot_spacing_y: 0.301          # 기본 자세에서 발의 좌우(y) 간격 (m)
    nominal_height: 0.280          # 몸통 기준점에서 발까지의 기본 높이 (m)
    center_of_mass_offset_x: 0.050 # IK 목표 좌표의 x축 보정값 (무게중심이 기하학적 중심에서 벗어난 만큼 보정, m)

    # --- 보행 타이밍 파라미터 ---
    swing_duration: 0.18           # 한 다리가 공중에 떠 있는 스윙 구간 시간 (s)
    stance_duration: 0.28          # 한 다리가 지지 중인 시간, stance_duration <= 1.3 * swing_duration 이어야 함 (s)
    clearance_height: 0.030        # 스윙 궤적에서 발이 들어올려지는 최대 높이 (m)
    penetration_depth: 0.005         # 스탠스 구간 중 발이 nominal 높이보다 아래로 내려가는 최대 깊이, 접지 컴플라이언스를 흉내내는 값 (m)

    # --- 걷는 동안의 고정 몸통 자세 보정 ---
    walking_pitch_bias: 0.0872665        # 보행 중 몸통을 앞으로 기울이는 고정 pitch 값, 양수=전방 기울임 (rad)

    # --- 속도 명령 및 램프 제어 ---
    max_linear_speed: 0.3          # cmd_vel로 허용되는 최대 선속도, 초과 시 예외 발생 (m/s)
    max_yaw_rate: 1.0              # cmd_vel로 허용되는 최대 요(yaw) 각속도, 초과 시 예외 발생 (rad/s)
    stop_return_speed: 0.08        # 정지 후 발이 오프셋 위치에서 nominal stance로 복귀하는 속도 (m/s)
    velocity_ramp_rate: 1.5        # cmd_vel 목표 속도가 변할 때 적용되는 가속 램프율 (m/s^2, rad/s^2)
    stop_ramp_rate: 1.5            # cmd_vel 목표가 정지(0)로 바뀔 때 적용되는 감속 램프율 (m/s^2, rad/s^2)
    command_timeout: 0.50          # 마지막 cmd_vel 수신 후 이 시간이 지나면 자동으로 속도를 0으로 정지 (s)

    # --- view 모드 자세 명령 속도 제한 ---
    view_translation_rate: 0.08    # 몸통 x/y/z 목표로 이동하는 최대 속도 (m/s)
    view_rotation_rate: 0.50       # 몸통 roll/pitch/yaw 목표로 회전하는 최대 속도 (rad/s)

    # --- 앉기 자세 및 전환 시간 ---
    sit_transition_duration: 3.0   # 앉기/기본 자세 전환에 걸리는 시간 (s)
    sit_hip_angle: 0.0             # hip 목표각 0 deg (rad)
    sit_upper_angle: 2.3561944902  # upper 목표각 135 deg (rad)
    sit_lower_angle: -2.2340214426 # lower 목표각 -128 deg (rad)

    # --- 제어 루프 및 시작 옵션 ---
    control_frequency: 100.0       # 제어 루프 주기 (Hz)
    start_enabled: true            # 노드 시작 즉시 gait 출력을 활성화할지 여부

    

    # --- 자세(roll/pitch) 밸런싱 PID (IMU 기반, balance 기능 활성화 시 사용) ---
    pose_pid:
      kp: 1.5                      # 비례 게인
      ki: 0.1                      # 적분 게인
      kd: 0.05                     # 미분(각속도 감쇠) 게인
      integral_limit: 0.5          # 적분항 windup 방지 한계값
